{% extends "base.html" %}
{% block kind %}cover{% endblock %}
{% block content %}
<section class="fit-box" data-name="cover">
  <p class="kicker">바로 써먹는 {{ items|length }}가지</p>
  <h1 class="headline" data-fit="58">{{ data.headline }}</h1>
  <ol class="index">
    {% for it in items %}
    <li><span class="no">{{ "%02d"|format(loop.index) }}</span><span data-fit="24">{{ it.title }}</span></li>
    {% endfor %}
  </ol>
</section>
{% endblock %}
