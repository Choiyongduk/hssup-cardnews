name: Daily Brief

# 아침 보고와 월요일 회의록.
# 전부 원장님이 앱을 열어야 돌아갔는데, 이건 먼저 말을 겁니다.
#
# 월요일이면 회의록도 같이 씁니다.
#
# cron-job.org 에 이 잡이 등록돼 있지 않아 10/5·10/6 아침에 아무것도 안 나갔다.
# 그래서 GitHub schedule 로 부른다. 몇십 분 밀릴 수 있어 8시보다 조금 일찍 건다.
# cron-job.org 에도 등록하면 하루 두 번 돌아 아이디어가 두 벌 나가니, 둘 중 하나만 쓸 것.
on:
  schedule:
    - cron: "30 22 * * *"  # 매일 07:30 KST
  workflow_dispatch:
    inputs:
      meeting:
        description: "회의록도 쓸지 (yes/no/auto)"
        required: false
        default: "auto"

permissions:
  contents: read

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install anthropic PyYAML python-dotenv requests

      # 오늘 올리면 좋을 콘텐츠 아이디어 5개. 아침 보고보다 먼저 써서 같은 아침에 앱에 뜨게.
      # 실패해도 아침 보고는 나가야 한다.
      - name: Daily content ideas
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}  # 있으면 구독 먼저 (engine/llm.py)
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HSSUP_MAIN_IG_BUSINESS_ID: ${{ secrets.HSSUP_MAIN_IG_BUSINESS_ID }}
          HSSUP_MAIN_IG_TOKEN: ${{ secrets.HSSUP_MAIN_IG_TOKEN }}
        run: python daily_ideas.py --count 5

      # 새로 쓰거나 고친 꿀팁 글에만 복습 카드를 만든다. 대부분의 날은 할 일이 없어 바로 끝난다.
      - name: Make study cards for new tips
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python make_study_cards.py --limit 3

      # 매달 1일에만. 올리기 좋은 시간은 한 달에 한 번 보면 충분하다(analyze_post_times.py, AI 안 씀).
      - name: Check the best posting times
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HSSUP_MAIN_IG_BUSINESS_ID: ${{ secrets.HSSUP_MAIN_IG_BUSINESS_ID }}
          HSSUP_MAIN_IG_TOKEN: ${{ secrets.HSSUP_MAIN_IG_TOKEN }}
        run: |
          if [ "$(TZ=Asia/Seoul date +%d)" = "01" ]; then python analyze_post_times.py; else echo "매달 1일에만 봅니다"; fi

      - name: Write the morning brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}  # 있으면 구독 먼저 (engine/llm.py)
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HSSUP_ACADEMY_BOT_TOKEN: ${{ secrets.HSSUP_ACADEMY_BOT_TOKEN }}
        run: python morning_brief.py

      # 월요일에만 회의를 엽니다. 매일 하면 아무도 안 읽습니다.
      - name: Hold the weekly meeting
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}  # 있으면 구독 먼저 (engine/llm.py)
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HSSUP_ACADEMY_BOT_TOKEN: ${{ secrets.HSSUP_ACADEMY_BOT_TOKEN }}
          WANT: ${{ inputs.meeting }}
        run: |
          DOW=$(TZ=Asia/Seoul date +%u)
          if [ "$WANT" = "yes" ] || { [ "$WANT" != "no" ] && [ "$DOW" = "1" ]; }; then
            python weekly_meeting.py
          else
            echo "오늘은 회의 없는 날입니다 (요일 $DOW)"
          fi
