name: Process Now

# 앱에서 "지금 바로" 로 올린 소재를 처리합니다.
# 원장님이 기다리는 일이라 cron-job.org가 몇 분마다 호출합니다.
#
# 인스타에 바로 올리지는 않습니다. 캡션과 로고를 붙여 승인 요청까지만 앞당깁니다.
#
# 오버레이를 만들려면 Playwright와 ffmpeg이 필요한데 설치가 느립니다.
# 그래서 먼저 값싸게 "급한 게 있나"만 확인하고, 있을 때만 설치합니다.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: process-queue      # 정기 처리와 같은 대기열을 건드리므로 겹치지 않게 한다
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for urgent media
        id: check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          pip install --quiet requests
          python - <<'PY'
          import os, requests
          r = requests.get(
              f"{os.environ['SUPABASE_URL']}/rest/v1/ai_media_queue",
              headers={
                  "apikey": os.environ["SUPABASE_SERVICE_ROLE_KEY"],
                  "Authorization": f"Bearer {os.environ['SUPABASE_SERVICE_ROLE_KEY']}",
              },
              params={"select": "id", "status": "eq.queued", "urgency": "eq.now", "limit": "1"},
              timeout=30,
          )
          has_work = r.status_code == 200 and len(r.json()) > 0
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"has_work={'true' if has_work else 'false'}\n")
          print("급한 소재", "있음" if has_work else "없음")
          PY

      - name: Install dependencies
        if: steps.check.outputs.has_work == 'true'
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
          ffmpeg -version || sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Process urgent items
        if: steps.check.outputs.has_work == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}  # 있으면 구독 먼저 (engine/llm.py)
          PREPPY_POP_BOT_TOKEN: ${{ secrets.PREPPY_POP_BOT_TOKEN }}
          HSSUP_ACADEMY_BOT_TOKEN: ${{ secrets.HSSUP_ACADEMY_BOT_TOKEN }}
          ARTMAKE_BOT_TOKEN: ${{ secrets.ARTMAKE_BOT_TOKEN }}
          ASSETS_REPO: ${{ secrets.ASSETS_REPO }}
          ASSETS_REPO_TOKEN: ${{ secrets.ASSETS_REPO_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python process_queue.py --urgent

      - name: Commit queue/pending/state updates
        if: steps.check.outputs.has_work == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add queue/ pending/ state/
          git diff --cached --quiet || git commit -m "chore: process urgent media [skip ci]"
          git pull --rebase origin master
          git push
