name: Daily News Cardnews

on:
  workflow_dispatch:  # cron-job.org가 매일 아침 9시(KST)에 호출

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Render hssup-news
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HSSUP_ACADEMY_BOT_TOKEN: ${{ secrets.HSSUP_ACADEMY_BOT_TOKEN }}
          ASSETS_REPO: ${{ secrets.ASSETS_REPO }}
          ASSETS_REPO_TOKEN: ${{ secrets.ASSETS_REPO_TOKEN }}
        run: python render.py --channel hssup-news
        continue-on-error: true  # 오늘 관련 뉴스가 없으면 정상적으로 건너뜀 (실패 취급 안 함)

      - name: Commit updated state and pending record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/ pending/
          git diff --cached --quiet || git commit -m "chore: render hssup-news + update state [skip ci]"
          git pull --rebase origin master
          git push
