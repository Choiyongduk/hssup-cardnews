# 히썹 아카데미 전용 계정 채널 (@hssup_academy, 메인 계정 @h_ssup_과는 다른 별도 계정).
# 사모님이 텔레그램 봇으로 사진/영상 + 설명을 보내면, Claude가 캡션을 써서 승인 요청을 보내고,
# 승인하면 Instagram에 게시합니다. (RSS/렌더링형이 아니라 미디어 인박스형 채널입니다.)
slug: hssup-academy
name: 히썹 아카데미
handle: "@hssup_academy"
topic: 히썹 반영구 아카데미 수강·교육 콘텐츠 (강의, 실습, 수료, 반영구 업계 최신 정보)   # 캡션 작성 시 사용되는 채널 주제

source:
  type: telegram_inbox           # poll_telegram.py가 처리 (render.py는 이 채널에 사용 안 함)

telegram:
  bot_token_env: HSSUP_ACADEMY_BOT_TOKEN
  chat_id: "8582929102"

hashtags:
  - 히썹
  - 반영구
  - 눈썹문신
  - PMU교육
  - 반영구아카데미

# Meta Graph API (앱은 다른 두 채널과 공용, 계정만 다름)
instagram:
  business_id_env: HSSUP_ACADEMY_IG_BUSINESS_ID
  token_env: HSSUP_ACADEMY_IG_TOKEN

# 보내주신 사진에 히썹 브랜드 로고+헤드라인을 자동으로 입혀서 게시 (engine/overlay.py)
overlay:
  logo: assets/logos/hssup-academy.png
  logo_video: assets/logos/hssup-academy-white.png   # 영상 위에선 흰색 로고 사용 (배경 없이)
  brand_color: "#fa5500"   # HISSUP orange (브랜드 가이드 PANTONE 293C / R255 G122 B0)

# DM 자동 응대 (poll_dm.py) — 받은 DM에 Claude가 답장 초안을 쓰고, 텔레그램으로 승인 요청을 보냅니다.
# 처음엔 사람이 승인 후 발송, 나중에 mode를 auto로 바꾸면 AI가 바로 자동 발송하도록 확장 예정.
dm:
  mode: manual
  page_id_env: HSSUP_ACADEMY_PAGE_ID   # 대화 조회·발송은 IG 계정 ID가 아닌 연결된 페이지 ID로 합니다
  # TODO: 실제 수강 문의 FAQ(가격, 커리큘럼, 일정, 위치 등)로 채워주세요 — 채워질수록 답장이 정확해집니다.
  context: |
    히썹 아카데미는 반영구 화장(눈썹, 아이라인, 입술 등) 전문 교육 기관입니다.
    정규과정, 원데이 클래스, 해외연수 등 다양한 과정을 운영합니다.
    구체적인 가격·일정은 아직 여기 채워지지 않았으니, 모르면 "정확한 안내를 위해 확인 후 다시 연락드리겠습니다"라고 답하세요.
