# 프레피팝(Preppy Pop) 반영구 색소 브랜드 채널.
# 사장님이 텔레그램 봇으로 사진/영상 + 설명을 보내면, Claude가 캡션을 써서 승인 요청을 보내고,
# 승인하면 Instagram에 게시합니다. (RSS/렌더링형이 아니라 미디어 인박스형 채널입니다.)
slug: preppy-pop
name: 프레피팝
handle: "@preppypop_official"
topic: 프레피팝 반영구 색소 브랜드   # 캡션 작성 시 사용되는 채널 주제

source:
  type: telegram_inbox           # poll_telegram.py가 처리 (render.py는 이 채널에 사용 안 함)

telegram:
  bot_token_env: PREPPY_POP_BOT_TOKEN
  chat_id: "8582929102"

hashtags:
  - 프레피팝
  - 반영구색소
  - PMU
  - 반영구화장

# Meta Graph API (앱은 히썹 아카데미와 공용, 계정만 다름)
instagram:
  business_id_env: PREPPY_POP_IG_BUSINESS_ID
  token_env: PREPPY_POP_IG_TOKEN
