# 히썹 시술계정 (@h_ssup_artmake). 시술 전후 사진/영상 + 시술 기법 콘텐츠 전용.
# 사모님이 텔레그램 봇으로 사진/영상 + 설명을 보내면, Claude가 캡션을 써서 승인 요청을 보내고,
# 승인하면 Instagram에 게시합니다. (RSS/렌더링형이 아니라 미디어 인박스형 채널입니다.)
slug: hssup-artmake
name: 히썹 아트메이크(시술계정)
handle: "@h_ssup_artmake"
topic: 히썹 반영구 시술 결과 및 기법 소개 (시술 전후, 디자인 포인트)   # 캡션 작성 시 사용되는 채널 주제

source:
  type: telegram_inbox           # poll_telegram.py가 처리 (render.py는 이 채널에 사용 안 함)

telegram:
  bot_token_env: ARTMAKE_BOT_TOKEN
  chat_id: "8582929102"

hashtags:
  - 히썹
  - 반영구
  - 눈썹문신
  - 아트메이크
  - 반영구시술

# Meta Graph API (앱은 다른 두 채널과 공용, 계정만 다름)
instagram:
  business_id_env: ARTMAKE_IG_BUSINESS_ID
  token_env: ARTMAKE_IG_TOKEN

# 보내주신 사진에 히썹 브랜드 로고+헤드라인을 자동으로 입혀서 게시 (engine/overlay.py)
overlay:
  logo: assets/logos/hssup-general.png
  brand_color: "#fa5500"   # HISSUP orange (브랜드 가이드 PANTONE 293C / R255 G122 B0)

# DM 자동 응대 (poll_dm.py) — 받은 DM에 Claude가 답장 초안을 쓰고, 텔레그램으로 승인 요청을 보냅니다.
dm:
  mode: manual
  page_id_env: ARTMAKE_PAGE_ID   # 대화 조회·발송은 IG 계정 ID가 아닌 연결된 페이지 ID로 합니다
  # TODO: 실제 시술 문의 FAQ(가격, 예약 방법, 위치, 시술 후 관리 등)로 채워주세요.
  context: |
    히썹 아트메이크는 눈썹, 아이라인, 입술 등 반영구 화장 시술 전문 계정입니다.
    구체적인 가격·예약 방법은 아직 여기 채워지지 않았으니, 모르면 "정확한 안내를 위해 확인 후 다시 연락드리겠습니다"라고 답하세요.
